<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Scuba Pal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container narrow">
        <button class="back-link" type="button" onclick="history.back()">← Back</button>
        <section class="card" th:object="${resetPasswordForm}">
            <span class="pill">New Password</span>
            <h1>Choose a new password</h1>
            <div th:if="${#fields.hasErrors('*')}" class="error">
                <p>Could not reset password.</p>
                <ul>
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li>
                </ul>
            </div>
            <p th:unless="${tokenUsable}" class="error">This reset link is invalid, expired, or already used.</p>
            <form th:if="${tokenUsable}" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post"
                class="form-stack">
                <input type="hidden" th:field="*{token}" />
                <label>New password
                    <input type="password" th:field="*{newPassword}" minlength="6" required autofocus />
                </label>
                <label>Confirm password
                    <input type="password" th:field="*{confirmPassword}" minlength="6" required />
                </label>
                <button class="button" type="submit">Reset password</button>
            </form>
        </section>
    </div>
</body>

</html>
