<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Scuba Pal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container narrow">
        <button class="back-link" type="button" onclick="history.back()">← Back</button>
        <section class="card">
            <span class="pill">Account Recovery</span>
            <h1>Reset your password</h1>
            <p class="muted">Enter your email or username. If the account exists, Scuba Pal sends a secure reset link.
            </p>
            <p th:if="${resetEmailSent}" class="success" th:text="${resetEmailSent}">Reset email sent.</p>
            <form th:action="@{/forgot-password}" th:object="${forgotPasswordForm}" method="post" class="form-stack">
                <label>Email or username
                    <input type="text" th:field="*{emailOrUsername}" required autofocus />
                </label>
                <button class="button" type="submit">Send reset link</button>
            </form>
            <p class="muted">For security, your current password is never emailed or exposed.</p>
        </section>
    </div>
</body>

</html>
