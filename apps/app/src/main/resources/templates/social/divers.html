<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divers</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container">
        <button class="back-link" type="button" onclick="history.back()">← Back</button>
        <h1>Discover Divers</h1>
        <section class="grid">
            <article class="card" th:each="user : ${users}">
                <span class="pill" th:text="${user.role}">role</span>
                <h3 th:text="${user.username}">username</h3>
                <p th:text="${user.city + ', ' + user.country}">city</p>
                <p>Dives logged: <strong th:text="${user.diveCount}">0</strong></p>
                <a class="button" th:href="@{'/profile/' + ${user.id}}">View Profile</a>
            </article>
        </section>
    </div>
</body>

</html>
