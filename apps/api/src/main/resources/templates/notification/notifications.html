<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notifications</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container narrow">
        <h1>Notifications</h1>
        <section class="grid one-col">
            <article class="card notification-card" th:each="notification : ${notifications}"
                th:classappend="${!notification.read} ? ' unread' : ''">
                <div class="section-title compact">
                    <h3 th:text="${notification.title}">Notification</h3>
                    <span class="pill" th:if="${!notification.read}">New</span>
                </div>
                <p th:text="${notification.message}">Message</p>
                <p class="muted" th:text="${#temporals.format(notification.createdAt, 'MMM d, yyyy h:mm a')}">time</p>
            </article>
            <p th:if="${#lists.isEmpty(notifications)}" class="muted">No notifications yet.</p>
        </section>
        <div class="pagination" th:if="${notificationPage != null and notificationPage.totalPages > 1}"><a
                th:if="${notificationPage.hasPrevious()}"
                th:href="@{/notifications(page=${notificationPage.number - 1}, size=${notificationPage.size})}">Previous</a><span
                th:text="${notificationPage.number + 1}">1</span><span>/</span><span
                th:text="${notificationPage.totalPages}">1</span><a th:if="${notificationPage.hasNext()}"
                th:href="@{/notifications(page=${notificationPage.number + 1}, size=${notificationPage.size})}">Next</a>
        </div>
    </div>
</body>

</html>
