spring.application.name=scuba-pal
logging.level.root=WARN

server.port=8080
server.address=0.0.0.0
# server.port=${APP_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scubapal}
spring.datasource.username=${DB_USERNAME:scubapal}
spring.datasource.password=${DB_PASSWORD:scubapal}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=identity,social,dive,certification,notification,messaging,learn
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

management.endpoints.web.exposure.include=health,info

# Public URL used when building password reset links.
app.base-url=http://localhost:8080

app.media.s3.bucket=${MEDIA_S3_BUCKET:scuba-pal-media-user-uploads-test-817455142561-us-west-2-an}
app.media.s3.region=${MEDIA_S3_REGION:us-west-2}
app.media.s3.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.upload-url-expires-minutes=${MEDIA_UPLOAD_URL_EXPIRES_MINUTES:10}
app.media.max-profile-image-bytes=${MEDIA_MAX_PROFILE_IMAGE_BYTES:5242880}
app.media.max-post-image-bytes=${MEDIA_MAX_POST_IMAGE_BYTES:10485760}

# OpenAPI / Swagger UI
springdoc.api-docs.version=OPENAPI_3_0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
