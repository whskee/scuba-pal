name: scuba-pal
services:
  db:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: scubapal
      POSTGRES_USER: scubapal
      POSTGRES_PASSWORD: scubapal
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server for Spring Boot
      - "8025:8025" # Mailpit web inbox

volumes:
  postgres_data:
