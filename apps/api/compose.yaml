name: scuba-pal
services:
  postgres:
    image: postgres:18
    # Use `docker ps` to check for running containers and their names.
    # container_name: postgres       Don't hardcode the container name to avoid conflicts with existing containers.
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    # container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server for Spring Boot
      - "8025:8025" # Mailpit web inbox

volumes:
  postgres_data:
