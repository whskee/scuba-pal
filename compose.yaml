name: scuba-pal
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scubapal}
      POSTGRES_USER: ${POSTGRES_USER:-scubapal_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scubapal}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - scubapal-postgres

volumes:
  postgres_data:
    # name: scubapal_postgres_data

networks:
  default:
