name: scuba-pal
services:
  postgres:
    image: postgres:18
    # container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scubapal}
      POSTGRES_USER: ${POSTGRES_USER:-scubapal_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scubapal_runtime_password}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      default:
      local-infra:
        aliases:
          - scubapal-postgres

volumes:
  postgres_data:
    # name: scubapal_postgres_data

networks:
  default:
  local-infra:
    external: true
