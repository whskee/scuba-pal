# ------------------------ DATABASE ------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scubapal}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# ------------------------------ MAILPIT -----------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=${APP_MAIL_FROM:no-reply@scubapal.local}
app.mail.enabled=${APP_MAIL_ENABLED:true}

app.security.jwt.secret=${JWT_SECRET:dev-only-scubapal-jwt-secret-change-me-please-32b}
