<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diver Profile</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container profile-page">
        <article class="profile-hero">
            <div class="profile-hero__content">
                <div class="profile-hero__identity">
                    <img class="profile-hero__photo" th:if="${user.profileImageUrl}" th:src="${user.profileImageUrl}"
                        alt="Profile image" />
                    <span class="profile-hero__photo" th:unless="${user.profileImageUrl}"
                        th:text="${user.initials()}">SP</span>
                    <div class="profile-hero__copy">
                        <div class="profile-hero__kicker">
                            <span th:text="${'@' + user.username}">@username</span>
                        </div>
                        <h1 th:text="${user.displayName()}">Diver Name</h1>
                        <p class="profile-bio" th:if="${user.bio}" th:text="${user.bio}">bio</p>
                        <div class="profile-details">
                            <span th:text="${user.locationDisplay()}">Phoenix, USA</span>
                            <span><strong th:text="${user.diveCount}">0</strong> dives logged</span>
                        </div>
                    </div>
                </div>
                <div class="profile-actions" th:if="${currentUser != null and currentUser.id != user.id}">
                    <form th:if="${!followSummary.followedByCurrentUser}"
                        th:action="@{'/profile/' + ${user.username} + '/follow'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button class="button"
                            type="submit">Follow</button></form>
                    <form th:if="${followSummary.followedByCurrentUser}"
                        th:action="@{'/profile/' + ${user.username} + '/unfollow'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button
                            class="button secondary" type="submit">Unfollow</button></form>
                    <form th:action="@{'/messages/start/' + ${user.id}}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /><button class="button"
                            type="submit">Message</button></form>
                </div>
                <div class="profile-stats">
                    <div class="profile-stat">
                        <strong th:text="${followSummary.followerCount}">0</strong>
                        <span>Followers</span>
                    </div>
                    <div class="profile-stat">
                        <strong th:text="${followSummary.followingCount}">0</strong>
                        <span>Following</span>
                    </div>
                    <div class="profile-stat">
                        <strong th:text="${#lists.size(posts)}">0</strong>
                        <span>Posts</span>
                    </div>
                </div>
                <div class="profile-network">
                    <section class="profile-network__group">
                        <h2>Followers</h2>
                        <p th:if="${#lists.isEmpty(followSummary.followers)}" class="muted">No followers yet.</p>
                        <div class="profile-network__list" th:unless="${#lists.isEmpty(followSummary.followers)}">
                            <a class="follow-row" th:each="follower : ${followSummary.followers}"
                                th:href="@{'/profile/' + ${follower.username}}">
                                <img class="connection-avatar" th:if="${follower.profileImageUrl}"
                                    th:src="${follower.profileImageUrl}" alt="" />
                                <span class="connection-avatar" th:unless="${follower.profileImageUrl}"
                                    th:text="${follower.initials()}">D</span>
                                <span>
                                    <strong th:text="${follower.displayName()}">diver</strong>
                                    <small th:text="${'@' + follower.username}">@diver</small>
                                </span>
                            </a>
                        </div>
                    </section>
                    <section class="profile-network__group">
                        <h2>Following</h2>
                        <p th:if="${#lists.isEmpty(followSummary.following)}" class="muted">Not following anyone yet.</p>
                        <div class="profile-network__list" th:unless="${#lists.isEmpty(followSummary.following)}">
                            <a class="follow-row" th:each="following : ${followSummary.following}"
                                th:href="@{'/profile/' + ${following.username}}">
                                <img class="connection-avatar" th:if="${following.profileImageUrl}"
                                    th:src="${following.profileImageUrl}" alt="" />
                                <span class="connection-avatar" th:unless="${following.profileImageUrl}"
                                    th:text="${following.initials()}">D</span>
                                <span>
                                    <strong th:text="${following.displayName()}">diver</strong>
                                    <small th:text="${'@' + following.username}">@diver</small>
                                </span>
                            </a>
                        </div>
                    </section>
                </div>
            </div>
        </article>
        <section class="section-title">
            <h2 th:text="${user.username + ' posts'}">Posts</h2>
        </section>
        <section class="grid profile-post-grid">
            <article class="card profile-post-card" th:each="post : ${posts}">
                <img class="feed-post__image feed-post__image--compact" th:if="${post.imageUrl}"
                    th:src="${post.imageUrl}" alt="">
                <p th:text="${post.caption}">caption</p>
                <p class="muted"><strong th:text="${post.likes}">0</strong> likes · <strong
                        th:text="${post.comments}">0</strong> comments</p><a class="button secondary"
                    th:href="@{'/posts/' + ${post.postId}}">Expand Post</a>
            </article>
            <p th:if="${#lists.isEmpty(posts)}" class="muted">No posts yet.</p>
        </section>
    </div>
</body>

</html>
