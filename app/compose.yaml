name: scuba-pal
services:
  db:
    image: postgres:18
    # container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${SCUBA_PAL_POSTGRES_DB}
      POSTGRES_USER: ${SCUBA_PAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SCUBA_PAL_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      default:
      dev-db-admin:
        aliases:
          - scuba-pal-postgres

  # mailpit:
  #   image: axllent/mailpit:latest
  #   # container_name: mailpit
  #   restart: unless-stopped
  #   ports:
  #     - "1025:1025" # SMTP server for Spring Boot
  #     - "8025:8025" # Mailpit web inbox
  #   networks:
  #     default:

volumes:
  postgres_data:
    # name: scuba_pal_postgres_data

networks:
  default:
  dev-db-admin:
    external: true
