<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post | Scuba Pal</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css" />
</head>

<body>
    <div th:replace="~{layout/nav :: nav}"></div>
    <div class="container narrow post-thread">
        <button class="back-link" type="button" onclick="history.back()">← Back</button>

        <article class="card post-detail-card" th:attr="data-post-id=${post.postId}">
            <span class="pill" th:text="${post.visibilityStatus}">PUBLIC</span>
            <div class="feed-meta">
                <img class="avatar" th:if="${post.authorProfileImageUrl}" th:src="${post.authorProfileImageUrl}"
                    alt="Profile image" />

                <span class="avatar" th:unless="${post.authorProfileImageUrl}"
                    th:text="${#strings.substring(post.username,0,1).toUpperCase()}">S</span>

                <a th:href="@{'/profile/' + ${post.username}}">
                    <strong th:text="${post.username}">username</strong>
                </a>
            </div>
            <img class="feed-post__image feed-post__image--detail" th:if="${post.imageUrl}" th:src="${post.imageUrl}"
                alt="">
            <p class="post-caption" th:text="${post.caption}">caption</p>
            <p class="muted"><strong data-like-count th:text="${post.likes}">0</strong> likes · <strong
                    th:text="${post.comments}">0</strong> comments</p>

            <form th:if="${loggedIn}" class="like-form" th:action="@{'/posts/' + ${post.postId} + '/like'}"
                method="post">
                <button class="heart-button" th:classappend="${post.likedByCurrentUser} ? ' is-liked' : ''"
                    type="submit" th:attr="aria-pressed=${post.likedByCurrentUser},
                    aria-label=${post.likedByCurrentUser ? 'Unlike post' : 'Like post'}"><span
                        class="heart-button__icon" aria-hidden="true"></span><span
                        class="heart-button__text"
                        th:text="${post.likedByCurrentUser ? 'Liked' : 'Like'}">Like</span></button>
            </form>
            <p th:unless="${loggedIn}" class="muted"><a th:href="@{/login}">Log in</a> to like or comment.</p>

            <section class="comments-card">
                <form th:if="${loggedIn}" th:action="@{'/posts/' + ${post.postId} + '/comments'}" method="post"
                    class="comment-composer">
                    <textarea name="commentText" placeholder="Add comment..." maxlength="500" required></textarea>
                    <div class="comment-composer__bar">
                        <div class="comment-tools" aria-hidden="true">
                            <span>B</span>
                            <span>I</span>
                            <span>U</span>
                            <span>|</span>
                            <span>+</span>
                            <span>img</span>
                            <span>:)</span>
                            <span>@</span>
                        </div>
                        <button class="comment-submit" type="submit">Submit</button>
                    </div>
                </form>
                <div class="comments-card__header">
                    <div>
                        <h2>Comments <span th:text="${post.comments}">0</span></h2>
                    </div>
                    <button class="comment-sort" type="button">Most recent</button>
                </div>
                <p th:if="${commentError}" class="error" th:text="${commentError}">Comment error</p>

                <div class="comment-list">
                    <article class="comment" th:each="comment : ${post.commentList}">
                        <img class="comment-avatar" th:if="${comment.authorProfileImageUrl}"
                            th:src="${comment.authorProfileImageUrl}" alt="" />
                        <span class="comment-avatar" th:unless="${comment.authorProfileImageUrl}"
                            th:text="${#strings.substring(comment.username,0,1).toUpperCase()}">D</span>
                        <div>
                            <div class="comment-meta-line">
                                <a class="comment-author" th:href="@{'/profile/' + ${comment.username}}">
                                    <strong th:text="${comment.username}">username</strong>
                                </a>
                                <span th:text="${#temporals.format(comment.createdAt, 'MMM d, h:mm a')}">just now</span>
                            </div>
                            <p th:text="${comment.commentText}">comment</p>
                            <div class="comment-actions">
                                <button type="button">Like</button>
                                <button type="button">Reply</button>
                                <button type="button">...</button>
                            </div>
                        </div>
                    </article>
                    <p th:if="${#lists.isEmpty(post.commentList)}" class="muted">No comments yet. Be the first to start the
                        thread.</p>
                </div>
            </section>
        </article>
    </div>
    <script th:src="@{/js/feed.js}" src="/js/feed.js"></script>
</body>

</html>
