spring.config.import=optional:file:.env[.properties]

# ------------------------- APPLICATION ------------------------
spring.application.name=scuba-pal
logging.level.root=WARN

server.port=${APP_PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info

# Public URL used when building password reset links.
app.base-url=http://localhost:8080

# JWT access tokens are stateless; refresh tokens are persisted and rotated.
app.security.jwt.issuer=${JWT_ISSUER:scuba-pal}
app.security.jwt.secret=${JWT_SECRET:dev-only-scuba-pal-jwt-secret-change-me-please-32b}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.security.jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:30d}



# ------------------------ DATABASE ------------------------
# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=identity,social,dive,certification,notification,messaging,learn
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true



# ------------------------ MEDIA ------------------------
# AWS S3
app.media.s3.bucket=${MEDIA_S3_BUCKET}
app.media.s3.region=${MEDIA_S3_REGION}
app.media.s3.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.upload-url-expires-minutes=${MEDIA_UPLOAD_URL_EXPIRES_MINUTES:10}
app.media.max-profile-image-bytes=${MEDIA_MAX_PROFILE_IMAGE_BYTES:5242880}
app.media.max-post-image-bytes=${MEDIA_MAX_POST_IMAGE_BYTES:10485760}



# ------------------------ OPENAPI / SWAGGER ------------------------
# springdoc.paths-to-match=/api/**, /auth/**, /admin/**
springdoc.api-docs.version=OPENAPI_3_0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
