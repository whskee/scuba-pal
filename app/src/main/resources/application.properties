# Read from .env file if it exists, but don't fail if it's missing (e.g. in production where env vars are set differently)
spring.config.import=optional:file:.env[.properties]

spring.application.name=scuba-pal
logging.level.root=WARN

server.port=${APP_PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info

# Public URL used when building password reset links.
app.base-url=http://localhost:8080



# ------------------------ DATABASE ------------------------
# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=identity,social,dive,certification,notification,messaging,learn
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true



# ------------------------ MEDIA ------------------------
# AWS S3
app.media.s3.bucket=${MEDIA_S3_BUCKET}
app.media.s3.region=${MEDIA_S3_REGION}
app.media.s3.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.upload-url-expires-minutes=${MEDIA_UPLOAD_URL_EXPIRES_MINUTES:10}
app.media.max-profile-image-bytes=${MEDIA_MAX_PROFILE_IMAGE_BYTES:5242880}
app.media.max-post-image-bytes=${MEDIA_MAX_POST_IMAGE_BYTES:10485760}

# ------------------------ OPENAPI / SWAGGER ------------------------
springdoc.api-docs.version=OPENAPI_3_0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
