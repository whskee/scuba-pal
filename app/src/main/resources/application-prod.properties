# ------------------------ DATABASE ------------------------
spring.datasource.url=${AWS_DB_URL}
spring.datasource.username=${AWS_DB_USERNAME}
spring.datasource.password=${AWS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate


# ------------------------------ MAILING -----------------------------
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${APP_MAIL_FROM}
app.mail.enabled=true

# Example production environment variables:
# export SPRING_PROFILES_ACTIVE=prod
# export SMTP_HOST=smtp.your-provider.com
# export SMTP_PORT=587
# export SMTP_USERNAME=your-smtp-username
# export SMTP_PASSWORD=your-smtp-password
# export APP_MAIL_FROM="Scuba Pal <no-reply@yourdomain.com>"


# ------------------------ OPENAPI / SWAGGER ------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
