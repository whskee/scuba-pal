# ------------------------ DATABASE ------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scuba_pal}
spring.datasource.username=${DB_USERNAME:scuba_pal}
spring.datasource.password=${DB_PASSWORD:scuba_pal}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration



# ------------------------------ MAILPIT -----------------------------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@scubapal.local
