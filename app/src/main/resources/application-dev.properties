# Local development email.
# Spring Boot sends mail to Mailpit instead of real inboxes.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.mail.from=no-reply@scubapal.local

# ------------------------ DATABASE CONFIGURATION ------------------------
spring.jpa.hibernate.ddl-auto=create-drop

spring.datasource.url=${AWS_DB_URL}
spring.datasource.username=${AWS_DB_USERNAME}
spring.datasource.password=${AWS_DB_PASSWORD}